services:
  postgres:
    image: postgres:16
    container_name: culinaryblog-postgres
    environment:
      POSTGRES_DB: CulinaryBlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - culinaryblog-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: culinaryblog-redis
    ports:
      - "6379:6379"
    volumes:
      - culinaryblog-redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: culinaryblog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - culinaryblog-minio-data:/data

volumes:
  culinaryblog-postgres-data:
  culinaryblog-redis-data:
  culinaryblog-minio-data:
